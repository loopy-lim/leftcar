<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B11" />
    <title>Leftcar Host Studio</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #080b11; color: #f8fafc; }
      .leftcar-boot {
        box-sizing: border-box;
        width: min(560px, calc(100% - 48px));
        margin: 48px auto;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: #0f172a;
        font: 500 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .leftcar-boot strong { display: block; margin-bottom: 8px; font-size: 20px; }
      .leftcar-boot span { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="leftcar-boot" data-leftcar-boot>
        <strong>Leftcar Host Studio</strong>
        <span>호스트 서비스를 시작하고 있습니다…</span>
      </main>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var boot = document.querySelector("[data-leftcar-boot]");
        if (!boot) return;
        var detail = event && event.message ? event.message : "프런트엔드를 불러오지 못했습니다.";
        boot.querySelector("span").textContent = "시작 오류: " + detail;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

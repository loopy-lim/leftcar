<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>Leftcar</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #fafafa; color: #09090b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #fafafa; }
      }
      .leftcar-boot {
        box-sizing: border-box;
        width: min(500px, calc(100% - 48px));
        margin: 64px auto;
        padding: 16px 0;
        font: 500 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .leftcar-boot strong { display: block; margin-bottom: 6px; font-size: 18px; font-weight: 600; color: #09090b; }
      @media (prefers-color-scheme: dark) {
        .leftcar-boot strong { color: #fafafa; }
      }
      .leftcar-boot span { color: #52525b; }
      @media (prefers-color-scheme: dark) {
        .leftcar-boot span { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="leftcar-boot" data-leftcar-boot>
        <strong>Leftcar</strong>
        <span>화면 공유를 준비하고 있습니다…</span>
      </main>
    </div>
    <script>
      window.addEventListener("error", function (event) {
        var boot = document.querySelector("[data-leftcar-boot]");
        if (!boot) return;
        var detail = event && event.message ? event.message : "프런트엔드를 불러오지 못했습니다.";
        boot.querySelector("span").textContent = "시작 오류: " + detail;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

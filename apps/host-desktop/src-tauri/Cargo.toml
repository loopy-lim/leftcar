[package]
name = "leftcar-host-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"

# Deliberately NOT a member of the repo root workspace: tauri pulls a large
# dependency graph that conflicts with the lean workspace lockfile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
libloading = "0.8"
mdns-sd = "0.11"
control-contract = { path = "../../../crates/control-contract" }
session = { path = "../../../crates/session" }
domain = { path = "../../../crates/domain" }
base64 = "0.22"
dirs = "5"
thiserror = "2"

[dev-dependencies]
tokio-test = "0.4"

name: Deploy Pages

# 임시 비활성화: Cloudflare Pages 시크릿(CLOUDFLARE_API_TOKEN·ACCOUNT_ID)
# 준비 전까지 자동 배포를 막는다. 활성화하려면 아래 on.push/pull_request
# 블록의 주석을 되돌리면 된다.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/deploy-pages.yml'
  # pull_request:
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/deploy-pages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        working-directory: ./site
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ./site
        run: bunx tsc --noEmit

      - name: Build
        working-directory: ./site
        run: bun run build

      - name: React Doctor Setup
        run: npm i -g react-doctor@latest

      - name: React Doctor Verify
        run: npx -y react-doctor@latest . --verbose

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=leftcar-site --branch=main
